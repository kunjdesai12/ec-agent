models:
  - type: main
    engine: openai
    model: Qwen2.5-7B-Instruct-GPTQ-Int4
    parameters:
      base_url: "http://localhost:8001/v1"
      api_key: "not-needed"

  - type: self_check
    engine: openai
    model: Qwen2.5-7B-Instruct-GPTQ-Int4
    parameters:
      base_url: "http://localhost:8001/v1"
      api_key: "not-needed"

embeddings:
  - model: BAAI/bge-m3
    engine: SentenceTransformers

rails:
  input:
    flows:
      - check jailbreak attempt
      - check off topic input
      - check competitor mention
      - check abusive language
      - check order manipulation
  dialog:
    user_messages:
      embeddings_only: true
      embeddings_only_similarity_threshold: 0.75
      embeddings_only_fallback_intent: general
  output:
    flows:
      - check response on topic
      - check no competitor mention in response
      - self check output